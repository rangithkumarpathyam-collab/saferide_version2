services:
  # --- SafeRide AI Command Center (Dispatcher Dashboard) ---
  - type: web
    name: saferide-command-center
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: EMERGENCY_DISPATCH_PHONE
        sync: false
      - key: TRANSLATION_PROVIDER
        value: deep_translator
      - key: RENDER_DEPLOYMENT_URL
        value: https://saferide-version2.onrender.com
    autoDeploy: true

  # --- SafeRide AI Mobile Companion App ---
  - type: web
    name: saferide-mobile-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run mobile_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: EMERGENCY_DISPATCH_PHONE
        sync: false
      - key: TRANSLATION_PROVIDER
        value: deep_translator
      - key: RENDER_DEPLOYMENT_URL
        value: https://saferide-version2.onrender.com
    autoDeploy: true
